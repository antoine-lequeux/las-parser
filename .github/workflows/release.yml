name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: las_parser-linux-avx2
            cmake_flags: "-DUSE_AVX2=ON"
          - os: ubuntu-latest
            asset_name: las_parser-linux-avx512
            cmake_flags: "-DUSE_AVX512=ON"

          - os: macos-latest
            asset_name: las_parser-macos-arm64
            cmake_flags: ""

          - os: windows-latest
            asset_name: las_parser-windows-avx2.exe
            cmake_flags: "-DUSE_AVX2=ON"
          - os: windows-latest
            asset_name: las_parser-windows-avx512.exe
            cmake_flags: "-DUSE_AVX512=ON"

    steps:
    - uses: actions/checkout@v4

    - name: Setup modern C++ compilers
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y g++-14
          echo "CXX=g++-14" >> $GITHUB_ENV
        elif [ "${{ runner.os }}" = "macOS" ]; then
          brew install llvm@18
          echo "CXX=$(brew --prefix llvm@18)/bin/clang++" >> $GITHUB_ENV
        fi

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install ${{ matrix.cmake_flags }}

    - name: Build & install
      run: |
        cmake --build build --config Release --parallel 4
        cmake --install build --config Release

    - name: Prepare artifact
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          cp install/bin/las_parser.exe ${{ matrix.asset_name }}
        else
          cp install/bin/las_parser ${{ matrix.asset_name }}
        fi

    - name: Upload to release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.asset_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}